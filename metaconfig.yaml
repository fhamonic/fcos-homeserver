core:
  ssh_authorized_keys:
    - <MY PUBLIC SSH KEY>

adguardhome:
  image: docker.io/adguard/adguardhome:latest
  macvlan:
    interface: eth0
    subnet: 192.168.0.0/24
    gateway: 192.168.0.1
  ip: 192.168.0.10
  host_proxy_ip: 192.168.0.11

caddy:
  image: docker.io/library/caddy:2.10
  http_port: 80
  https_port: 443
  sites:
    - hostname: jellyfin.mydomain.com
      port: 3002
    - hostname: overleaf.mydomain.com
      port: 3004
    - hostname: forgejo.mydomain.com
      port: 3005
    - hostname: immich.mydomain.com
      port: 3006
    - hostname: joplin.mydomain.com
      port: 3007
    - hostname: livesync.mydomain.com
      port: 3010
    - hostname: home.mydomain.com
      port: 3011
    - hostname: mail.mydomain.com
      port: 3012
    - hostname: mydomain.com
      redirect_to: https://home.mydomain.com{uri}
    - hostname: wg.mydomain.com
      directives: |
        @public not remote_ip 192.168.0.0/24
        respond @public 403
        reverse_proxy host.containers.internal:3008
    # Prometheus has no authentication: answer 403 to clients outside the LAN.
    - hostname: prometheus.mydomain.com
      directives: |
        @public not remote_ip 192.168.0.0/24
        respond @public 403
        reverse_proxy host.containers.internal:3013

ext4_drives:
  - uuid: <BLOC-DEVICE-UUID>
    mount_point: /var/hdd
    placeholder_dirs:
      - Movies
      - Shows
      - Music
      - Photos

forgejo:
  image: codeberg.org/forgejo/forgejo:13
  http_port: 3005
  ssh_port: 2222

homepage:
  image: ghcr.io/gethomepage/homepage:v1
  http_port: 3011
  allowed_hosts:
    - home.mydomain.com
  services:
    jellyfin:
      href: https://jellyfin.mydomain.com
      port: 3002
      key: <JELLYFIN API KEY>
    forgejo:
      href: https://forgejo.mydomain.com
      port: 3005
      key: <FORGEJO API TOKEN>
    immich:
      href: https://immich.mydomain.com
      port: 3006
      key: <IMMICH API KEY>
    wg_easy:
      href: http://192.168.0.11:3008
      port: 3008
      username: admin
      password: L0NgP@SsW0rD
    adguardhome:
      href: http://192.168.0.10
      url: http://192.168.0.10
      username: admin
      password: L0NgP@SsW0rD
    prometheus:
      href: https://prometheus.mydomain.com
      port: 3013
  custom_services:
    - name: vLLM
      group: Workstation
      href: http://192.168.0.27:8000/v1/models
      icon: mdi-brain
      description: Qwen3.8-27B
      widget:
        type: prometheusmetric
        url: http://host.containers.internal:3013
        refreshInterval: 5000
        metrics:
          - label: Running / waiting
            query: vllm:num_requests_running + vllm:num_requests_waiting
          - label: KV cache used
            query: vllm:kv_cache_usage_perc
            format:
              {
                type: number,
                scale: 100,
                suffix: " %",
                options: { maximumFractionDigits: 0 },
              }
          - label: Output tok/s (1 min)
            query: rate(vllm:generation_tokens_total[1m])
            format: { type: number, options: { maximumFractionDigits: 0 } }
          - label: Prefix cache hit rate
            query: rate(vllm:prefix_cache_hits_total[5m]) / rate(vllm:prefix_cache_queries_total[5m])
            format:
              {
                type: number,
                scale: 100,
                suffix: " %",
                options: { maximumFractionDigits: 0 },
              }
          - label: MTP acceptance
            query: rate(vllm:spec_decode_num_accepted_tokens_total[5m]) / rate(vllm:spec_decode_num_draft_tokens_total[5m])
            format:
              {
                type: number,
                scale: 100,
                suffix: " %",
                options: { maximumFractionDigits: 0 },
              }
          - label: Mean TTFT
            query: rate(vllm:time_to_first_token_seconds_sum[5m]) / rate(vllm:time_to_first_token_seconds_count[5m])
            format:
              {
                type: number,
                suffix: " s",
                options: { maximumFractionDigits: 2 },
              }

immich:
  image: ghcr.io/immich-app/immich-server:v2
  ml_image: ghcr.io/immich-app/immich-machine-learning:v2
  postgres_image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
  valkey_image: docker.io/valkey/valkey:8
  http_port: 3006
  db_storage_type: SSD
  photos_dir: /var/hdd/Photos

jellyfin:
  image: docker.io/jellyfin/jellyfin:10
  http_port: 3002
  media_volumes:
    - /var/hdd/Movies:/media/Movies:ro,Z
    - /var/hdd/Shows:/media/Shows:ro,Z
    - /var/hdd/Music:/media/Music:ro,Z
  hostname: jellyfin.mydomain.com

joplin:
  image: docker.io/joplin/server:3.5
  postgres_image: docker.io/postgres:16
  http_port: 3007
  hostname: joplin.mydomain.com

livesync:
  image: docker.io/library/couchdb:3.5
  http_port: 3010
  admin_username: admin
  admin_password: L0NgP@SsW0rD
  database: obsidiannotes

openwebui:
  image: ghcr.io/open-webui/open-webui:main
  http_port: 3009

overleaf:
  image: docker.io/rigon/sharelatex-full:6.0.0
  mongo_image: docker.io/mongo:8.0
  redis_image: docker.io/library/redis:7.4
  http_port: 3004
